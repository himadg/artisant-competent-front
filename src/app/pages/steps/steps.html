<section class="px-4 py-10 mx-auto space-y-8 max-w-screen-lg steps-accordion">

    <h1 class="text-xl font-semibold md:text-3xl title">{{ 'steps.title' | transloco }}</h1>

    <div class="space-y-4">

        <accordion variant="section" titleTag="h3" [title]="'steps.step1.title' | transloco">
            <div class="protection-body" [innerHTML]="'steps.step1.body' | transloco"></div>
        </accordion>

        <accordion variant="section" titleTag="h3" [title]="'steps.step2.title' | transloco">
            <div class="protection-body" [innerHTML]="'steps.step2.body' | transloco"></div>
        </accordion>

        <accordion variant="section" titleTag="h3" [title]="'steps.step3.title' | transloco">
            <div class="protection-body" [innerHTML]="'steps.step3.body' | transloco"></div>
        </accordion>

        <accordion variant="section" titleTag="h3" [title]="'steps.step4.title' | transloco">
            <div class="protection-body" [innerHTML]="'steps.step4.body' | transloco"></div>
        </accordion>

    </div>

    <div class="flex justify-center mt-6">
        <a [routerLink]="['/auth/register']"
            class="inline-block px-6 py-3 font-semibold no-underline rounded-lg bg-[#a97849] text-[var(--primary-beige)] w-fit">
            {{ 'steps.ctaRegister' | transloco }}
        </a>
    </div>

</section>
