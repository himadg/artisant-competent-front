@switch (role()) {
    @case ('PROFESSIONAL') {
        <dashboard-professional />
    }
    @case ('INDIVIDUAL') {
        <dashboard-individual />
    }
    @case ('ADMIN') {
        <dashboard-admin />
    }
    <!-- @case ('DIRECTION') {
        <dashboard-admin />
    } -->
    @default {
        <div class="flex justify-center items-center h-screen">
            <p>Chargement du tableau de bord...</p>
            <!-- Affiche le rôle pour voir s'il est bien là ou s'il est null -->
            <p>Rôle actuel : {{ role() }}</p>
        </div>
    }
}
