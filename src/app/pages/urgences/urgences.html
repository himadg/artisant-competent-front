<section class="px-4 py-10 mx-auto space-y-8 max-w-screen-lg">
    <div class="space-y-3 text-center">
        <h1 class="text-4xl font-semibold">{{ 'urgencesPage.title' | transloco }}</h1>
        <p class="text-[var(--text-secondary)]">{{ 'urgencesPage.description' | transloco }}</p>
    </div>

    <div class="grid gap-6 justify-center items-start sm:grid-cols-1 md:grid-cols-3 lg:grid-cols-4">
        @for (trade of trades; track trade.slug) {
            <a class="block w-48 text-center shrink-0 group" [routerLink]="['/job', trade.slug]">
                <div class="overflow-hidden mx-auto w-40 h-40 rounded-full border">
                    <img
                        [src]="trade.image"
                        [alt]="trade.name"
                        class="object-cover w-full h-full border"
                        loading="lazy"
                    />
                </div>
                <div class="mt-2 font-medium">
                    {{ 'jobs.list.' + trade.i18nKey + '.name' | transloco }}
                </div>
            </a>
        }
    </div>
</section>
