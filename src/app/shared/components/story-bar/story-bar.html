@if (groups().length > 0) {
    <div class="story-bar">
        <span class="story-bar-label">{{ 'home.storyBar.nearby' | transloco }}</span>
        <ul class="story-bar-list">
            @for (group of groups(); track group.professionalProfileId; let i = $index) {
                <li>
                    <button type="button" class="story-circle" (click)="openGroup(i)">
                        <span class="story-ring">
                            <span class="story-avatar">
                                @if (group.avatarUrl) {
                                    <img [src]="group.avatarUrl" [alt]="group.companyName" loading="lazy" />
                                } @else {
                                    <span class="story-avatar-placeholder">{{ group.companyName.charAt(0) }}</span>
                                }
                            </span>
                        </span>
                        <span class="story-name">{{ group.companyName }}</span>
                    </button>
                </li>
            }
        </ul>
    </div>
}

<story-viewer
    [story]="displayStory()"
    [videoUrl]="displayStory()?.videoUrl ?? null"
    [label]="displayLabel()"
    [allowDelete]="false"
    [hasPrev]="displayHasPrev()"
    [hasNext]="displayHasNext()"
    [showProfileLink]="!viewingPresentation()"
    (closeModal)="closeViewer()"
    (prevRequested)="prevStory()"
    (nextRequested)="nextStory()"
    (profileRequested)="showPresentation()"
/>
