<div class="messaging">
    <div class="messaging-list-pane md:flex-1" [class.pane-hidden]="mobileShowConversation()">
        <conversation-list [conversations]="conversations()" [selectedId]="selectedConversationId()" (selected)="selectConversation($event)" />
    </div>

    <div class="messaging-view-pane md:flex-1 lg:flex-[2]" [class.pane-visible]="mobileShowConversation()">
        @if (selectedConversation(); as conversation) {
            <conversation-view
                [conversation]="conversation"
                [messages]="messages()"
                [loadingMore]="loadingMoreMessages()"
                [hasMore]="hasMoreMessages()"
                (back)="closeConversation()"
                (sendMessage)="sendMessage($event)"
                (sendAttachment)="sendAttachment($event)"
                (openDemand)="openDemand.emit($event)"
                (loadMore)="loadMoreMessages()"
                (createQuote)="openQuoteModal($event)"
                (viewQuote)="openQuoteViewer($event)"
                (reportDispute)="openReportDispute()"
            />
        } @else {
            <div class="messaging-empty">{{ 'dashboard.messages.selectPrompt' | transloco }}</div>
        }
    </div>
</div>

@if (quoteModalOpen(); as demandId) {
    <quote-modal [demandId]="demandId" (closed)="quoteModalOpen.set(null)" />
}

@if (quoteViewerOpen(); as quoteId) {
    <quote-client-view [quoteId]="quoteId" (closed)="quoteViewerOpen.set(null)" />
}

@if (reportDisputeOpen()) {
    <div class="dispute-overlay" (click)="closeReportDispute()">
        <div class="dispute-modal" (click)="$event.stopPropagation()">
            <h3>{{ 'mission.infos.reportConflict' | transloco }}</h3>
            <textarea
                rows="4"
                [value]="disputeReason()"
                (input)="disputeReason.set($any($event.target).value)"
                [placeholder]="'mission.conflict.placeholder' | transloco"
            ></textarea>
            <div class="dispute-modal__actions">
                <button type="button" (click)="closeReportDispute()">{{ 'common.cancel' | transloco }}</button>
                <button type="button" [disabled]="submittingDispute()" (click)="submitReportDispute()">
                    {{ 'mission.conflict.submit' | transloco }}
                </button>
            </div>
        </div>
    </div>
}
