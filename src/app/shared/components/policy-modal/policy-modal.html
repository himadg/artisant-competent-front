<ng-template #bodyTpl>
    <div class="legal-modal__body">
        @if (tab() === 'annulation') {
            <legal-sections titleKey="policy.annulation.title" [keys]="annulationKeys" />
        }
        @if (tab() === 'confidentialite') {
            <legal-sections titleKey="policy.confidentialite.title" [keys]="confidentialiteKeys" />
        }
        @if (tab() === 'cookies') {
            <legal-sections titleKey="policy.cookies.title" [keys]="cookiesKeys" />
        }
    </div>
</ng-template>

<!-- ── Mode overlay ── -->
@if (modal()) {
    <div class="legal-overlay" (click)="onOverlayClick($event)" (keydown.escape)="close()">
        <dialog open class="legal-modal" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
            <div class="legal-modal__header legal-modal__header--close-only">
                <button class="legal-modal__close" (click)="close()" type="button" aria-label="Fermer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <ng-container *ngTemplateOutlet="bodyTpl" />
        </dialog>
    </div>
}
