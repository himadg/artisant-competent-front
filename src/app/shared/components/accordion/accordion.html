<div
    class="accordion"
    [class.accordion--faq]="variant() === 'faq'"
    [class.accordion--open]="expanded()"
>
    <button
        type="button"
        class="accordion__trigger"
        [id]="headerId"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="panelId"
        (click)="toggle()"
    >
        @switch (titleTag()) {
            @case ('h3') {
                <h3 class="accordion__title">{{ title() }}</h3>
            }
            @case ('h4') {
                <h4 class="accordion__title">{{ title() }}</h4>
            }
            @default {
                <span class="accordion__title">{{ title() }}</span>
            }
        }
        <svg
            class="accordion__chevron"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
        >
            <path
                d="m6 9 6 6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>

    <div
        class="accordion__panel"
        [id]="panelId"
        role="region"
        [attr.aria-labelledby]="headerId"
        [attr.inert]="expanded() ? null : ''"
    >
        <div class="accordion__panel-inner">
            @if (summary()) {
                <p class="accordion__summary">{{ summary() }}</p>
            }
            <div class="accordion__content">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</div>
