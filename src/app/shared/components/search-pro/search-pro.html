<div class="rounded-3xl bg-[var(--primary-water-green)] text-[#f7c6b7] p-4 shadow mt-10 md:p-6 lg:rounded-full">
    <form class="flex flex-col justify-between gap-3 md:flex-row md:items-end" (ngSubmit)="submit()">
        <div class="flex flex-col flex-1 gap-3 lg:flex-row lg:items-center">
            <!-- Adresse avec autocomplétion -->
            <div class="relative flex-1">
                <input [value]="address" name="address" type="text" autocomplete="off"
                    class="w-full px-3 py-2 rounded-full border bg-[var(--primary-beige)] text-[var(--secondary-water-green)] placeholder:text-[var(--secondary-water-green)]/70"
                    [placeholder]="'searchPro.addressLabel' | transloco" (input)="onAddressInput($event)"
                    (blur)="closeAddressSuggestions()" />
                @if (addressOpen() && addressSuggestions().length) {
                    <ul class="absolute overflow-hidden right-0 left-0 top-full z-10 mt-1 text-sm text-gray-800 bg-white rounded-2xl border shadow-lg">
                        @for (suggestion of addressSuggestions(); track suggestion.label) {
                            <li class="px-4 py-2 cursor-pointer hover:bg-gray-50" (click)="selectAddress(suggestion)">
                                {{ suggestion.label }}
                            </li>
                        }
                    </ul>
                }
            </div>

            <!-- Métier -->
            <div class="lg:w-60">
                <select [(ngModel)]="trade" name="trade"
                    class="appearance-none w-full px-3 py-2 rounded-full border bg-[var(--primary-beige)] text-[var(--secondary-water-green)]">
                    <option value="" disabled selected>{{ 'searchPro.tradeLabel' | transloco }}</option>
                    @for (t of trades(); track t.id) {
                        <option [value]="t.name">{{ `jobs.list.${t.name}.name` | transloco }}</option>
                    }
                </select>
            </div>
        </div>

        <div class="flex flex-col flex-end gap-3 lg:flex-row lg:items-center">
            <!-- Rayon en km -->
            <div class="flex-1 md:w-32">
                <span class="block mb-1 text-sm">{{ 'searchPro.kilometersLabel' | transloco }}</span>
                <div class="relative mx-auto range-wrap w-[90%] md:w-[95%] md:w-42">
                    <input [(ngModel)]="kilometersIndex" name="kilometersIndex" type="range" min="0" max="5" step="1"
                        class="w-full range" />
                    <div class="-translate-x-1/2 -translate-y-1/2 cursor-pointer thumb-value w-7 h-7 md:w-6 md:h-6"
                        [style.left.%]="sliderPercent">
                        {{ kilometers }}
                    </div>
                </div>
            </div>

            <button type="submit" class="flex-1 px-4 py-2 rounded-full bg-grad-beige text-[var(--primary-water-green)]">
                {{ 'searchPro.button' | transloco }}
            </button>
        </div>
    </form>
</div>
