@if (story()) {
    <div class="modal-overlay" (click)="closeModal.emit()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-time-ago">{{ timeAgo() }}</span>
                <button class="close-btn" (click)="closeModal.emit()" aria-label="Fermer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                @if (videoUrl()) {
                    <video [src]="videoUrl()" controls autoplay muted class="story-video"></video>
                } @else {
                    <span class="spinner"></span>
                }
            </div>
            <div class="modal-footer">
                <button class="delete-btn" (click)="deleteRequested.emit()" aria-label="Supprimer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
}
