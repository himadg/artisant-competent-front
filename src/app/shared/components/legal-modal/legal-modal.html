<!-- ── Contenu réutilisé dans les deux modes ── -->

<ng-template #tabsTpl>
    <div class="legal-modal__tabs">
        <button class="legal-tab" [class.legal-tab--active]="activeTab() === 'cgu'" (click)="setTab('cgu')" type="button">
            {{ 'legal.cgu.tab' | transloco }}
        </button>
        <button class="legal-tab" [class.legal-tab--active]="activeTab() === 'cgv'" (click)="setTab('cgv')" type="button">
            {{ 'legal.cgv.tab' | transloco }}
        </button>
    </div>
</ng-template>

<!-- ── Mode intégré (dashboard) ── -->
@if (inline()) {
    <div class="legal-inline">
        <ng-container *ngTemplateOutlet="tabsTpl" />
        <ng-container *ngTemplateOutlet="bodyTpl" />
    </div>
}

<!-- ── Mode overlay (formulaires d'inscription) ── -->
@if (modal()) {
    <div class="legal-overlay" (click)="onOverlayClick($event)">
        <div class="legal-modal" role="dialog" aria-modal="true">
            <div class="legal-modal__header">
                <ng-container *ngTemplateOutlet="tabsTpl" />
                <button class="legal-modal__close" (click)="close()" type="button" aria-label="Fermer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <ng-container *ngTemplateOutlet="bodyTpl" />
        </div>
    </div>
}
