@if (document()) {
    <div class="modal-overlay" (click)="closeModal.emit()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">{{ document()?.title || ('docModal.defaultTitle' | transloco) }}</h3>
                <button class="close-btn" (click)="closeModal.emit()" [attr.aria-label]="'common.close' | transloco">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                @if (isWebp()) {
                    <img [src]="document()?.url" [alt]="document()?.title || ('docModal.defaultAlt' | transloco)" class="preview-img" />
                } @else if (isPdf() && safePdfUrl()) {
                    <object [data]="safePdfUrl()" type="application/pdf" class="preview-pdf">
                        <p>
                            {{ 'docModal.pdfUnsupported' | transloco }}
                            <a [href]="document()?.url" target="_blank" rel="noopener">{{ 'docModal.downloadPdf' | transloco }}</a>.
                        </p>
                    </object>
                } @else {
                    <div class="preview-unsupported">
                        <p>{{ 'docModal.previewUnavailable' | transloco }}</p>
                        <a [href]="document()?.url" target="_blank" rel="noopener" class="download-link"
                            >{{ 'docModal.openDocument' | transloco }}</a
                        >
                    </div>
                }
            </div>
        </div>
    </div>
}
