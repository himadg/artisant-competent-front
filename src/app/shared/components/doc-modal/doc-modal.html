@if (document()) {
    <div class="modal-overlay" (click)="closeModal.emit()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">{{ document()?.title || 'Aperçu du document' }}</h3>
                <button class="close-btn" (click)="closeModal.emit()" aria-label="Fermer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                @if (isWebp()) {
                    <img [src]="document()?.url" [alt]="document()?.title || 'Aperçu'" class="preview-img" />
                } @else if (isPdf() && safePdfUrl()) {
                    <object [data]="safePdfUrl()" type="application/pdf" class="preview-pdf">
                        <p>
                            Votre navigateur ne supporte pas la prévisualisation de PDF.
                            <a [href]="document()?.url" target="_blank" rel="noopener">Télécharger le PDF</a>.
                        </p>
                    </object>
                } @else {
                    <div class="preview-unsupported">
                        <p>Aperçu non disponible pour ce type de fichier.</p>
                        <a [href]="document()?.url" target="_blank" rel="noopener" class="download-link"
                            >Ouvrir le document</a
                        >
                    </div>
                }
            </div>
        </div>
    </div>
}
