<div
    role="region"
    aria-label="Annonce paiement Klarna"
    class="announcement-banner flex justify-center items-center px-4 text-center bg-[var(--primary-water-green)] text-[var(--primary-beige)]"
>
    <p class="text-xs leading-tight sm:text-sm">
        {{ 'banner.klarna.textBefore' | transloco }}
        <a
            href="/#faq-klarna"
            (click)="onKlarnaClick($event)"
            class="font-semibold no-underline cursor-pointer text-[#FFA8CD] hover:underline"
        >Klarna</a>{{ 'banner.klarna.textAfter' | transloco }}
    </p>
</div>
